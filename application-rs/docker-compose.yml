name: application-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  test:
    - CMD
    - bash
    - -c
    - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  api:
    image: ghcr.io/yansongda/application:application-api-v1.22.0
    container_name: application-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.toml:/www/config.toml:ro
    environment:
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck: *default-healthcheck
    mem_limit: 512m
    networks:
      - prod

  api-test:
    image: ghcr.io/yansongda/application:application-api-v1.22.0
    container_name: application-api-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./config.test.toml:/www/config.toml:ro
    environment:
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck: *default-healthcheck
    mem_limit: 256m
    networks:
      - test

networks:
  prod:
    name: application-prod
    driver: bridge
  test:
    name: application-test
    driver: bridge
