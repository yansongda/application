[package]
name = "application-api"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "application-api"
path = "src/bin/api.rs"

[dependencies]
application-kernel = { path = "../application-kernel" }
application-database = { path = "../application-database" }
application-http = { path = "../application-http" }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

ulid = { workspace = true }

tokio = { version = "1.53.3", features = ["full"] }
salvo = { version = "1.0.1", features = ["cors", "request-id", "logging", "catch-panic", "timeout", "compression"] }
futures-util = { version = "0.3.34" }
bytes = { version = "1.12.1" }

murmurs = { version = "1.0.5" }
base62 = { version = "2.2.6" }
url = { version = "2.5.8" }
totp-rs = { version = "6.0.0", features = ["otpauth"] }

aes-gcm = { version = "0.10.3" }
base64 = { version = "0.22.1" }
getrandom = { version = "0.2.17" }
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
sha2 = { version = "0.10.9" }
zeroize = { version = "1.9.1" }
